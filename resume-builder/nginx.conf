# resume-builder: the whole server config.
#
# This file is copied to /etc/nginx/conf.d/default.conf, NOT to
# /etc/nginx/nginx.conf. That matters: the unprivileged base image ships a
# main nginx.conf that already relocates the pid file and every temp path
# under /tmp so nginx can run as uid 101 with a read-only root filesystem.
# Overwriting it would put those paths back under /var, and the container
# would fail to start as non-root. Only the server block belongs here.

server {
    # 8080, not 80. A process without CAP_NET_BIND_SERVICE cannot bind a port
    # below 1024, and this container deliberately has no capabilities at all.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Liveness and readiness target. Answered by nginx itself, so it reports
    # "the server is accepting connections" and nothing more - which is all a
    # static site has to prove. Kept out of the access log: a probe every few
    # seconds would otherwise be the only thing in it.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Long cache on the stylesheet is safe because the image tag is immutable:
    # a new build is a new tag is a new pod, never a changed file behind the
    # same URL.
    location ~* \.(css|js|png|jpe?g|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # The HTML itself is not cached, so a redeploy is visible immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Nothing here is embedded elsewhere, typed into, or an API.
    add_header X-Content-Type-Options "nosniff"   always;
    add_header X-Frame-Options        "DENY"      always;
    add_header Referrer-Policy        "no-referrer" always;

    # No external requests of any kind: no CDN, no font host, no analytics.
    # This policy is only true because style.css is served from this origin -
    # if a future edit adds an external asset, this line must change with it.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
}
